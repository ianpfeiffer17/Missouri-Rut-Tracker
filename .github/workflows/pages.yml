name: Refresh weather and publish

on:
  push:
    branches: [main]
  schedule:
    # Every hour at :17. Each check reads the models' run-time files first and only downloads
    # (and republishes) when a new GFS/ECMWF run, ensemble or CPC outlook has landed.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.chk.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - id: pages
        uses: actions/configure-pages@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pyshp

      - name: Get the feed that is live now (keeps the run-by-run history)
        run: |
          mkdir -p prev
          for f in meta ens cpc hist g_gfs_t g_gfs_td g_gfs_ws g_gfs_wd g_gfs_wg g_gfs_p g_ecmwf_t g_ecmwf_td g_ecmwf_ws g_ecmwf_wd g_ecmwf_wg g_ecmwf_p; do
            curl -fsSL "${{ steps.pages.outputs.base_url }}/feed/$f.json" -o "prev/$f.json" || rm -f "prev/$f.json"
          done
          ls prev

      - name: Pull the latest GFS/ECMWF runs, ensembles and CPC outlooks
        continue-on-error: true
        env:
          # scheduled checks download only what changed; a manual "Run workflow" refreshes everything
          RUT_SMART: ${{ github.event_name == 'schedule' && '1' || '0' }}
          # optional: an Open-Meteo API key (repository secret) if the free per-address limit is ever hit
          OPEN_METEO_KEY: ${{ secrets.OPEN_METEO_KEY }}
        run: python3 -I scripts/rut_updater.py new prev

      - name: Anything new?
        id: chk
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f new/unchanged ]; then
            echo "No new model runs or outlooks since $(cat new/unchanged); nothing to publish."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble the site
        if: steps.chk.outputs.deploy == 'true'
        run: |
          mkdir -p _site/feed
          cp index.html .nojekyll _site/
          [ -f config.enc.json ] && cp config.enc.json _site/ || echo "no config.enc.json yet: field reports stay in each browser"
          cp feed/*.json _site/feed/ 2>/dev/null || true      # starter copy in the repo
          cp prev/*.json _site/feed/ 2>/dev/null || true      # what was live
          # use this run only if it got at least one model; otherwise keep what was live
          if python3 -c "import json,sys; m=json.load(open('new/meta.json')); sys.exit(0 if (m.get('models') or m.get('ens')) else 1)" 2>/dev/null; then
            cp new/*.json _site/feed/
          else
            echo "this run got no model data; keeping the live feed"
          fi
          rm -f _site/feed/manifest.json
          [ -f new/manifest.json ] && python3 -c "import json; m=json.load(open('new/manifest.json')); print('errors:', m['errors']); [print(k, v) for k, v in m['status'].items()]" || echo "updater produced nothing this run"

      - uses: actions/upload-pages-artifact@v3
        if: steps.chk.outputs.deploy == 'true'
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
